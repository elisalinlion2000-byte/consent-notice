<!DOCTYPE html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>領隊平台使用指南</title><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="shortcut icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: 單欄；身分＋出團日 → 依「出團前／帶團中／回團後」三段顯示該用的平台 */
:root{
  --hl:#fff176;
  --ok:#1a7f37;--ok-soft:#e6f4ea;
  --bg:#f6f7f9;--surface:#fff;--fg:#1d2430;--muted:#5d6878;--line:#dde2e9;
  --accent:#c8102e;--accent-soft:#fbe9ec;--app:#1f6feb;--app-soft:#e7f0fe;--web:#8a5a00;--web-soft:#fdf2dc;--paper:#4b5563;--paper-soft:#eceef1;
  --display:"Noto Serif TC",serif;--body:"Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c;--surface:#1b2129;--fg:#e8ecf1;--muted:#9aa5b4;--line:#2d3540;
  --accent:#ff5c72;--accent-soft:#3a1d23;--app:#6ea8ff;--app-soft:#1a2a44;--web:#f0b54a;--web-soft:#3a2d13;--paper:#c3cad4;--paper-soft:#2a313b;--ok:#56d364;--ok-soft:#143021;--hl:#8a7a00;color-scheme:dark}}
:root[data-theme="dark"]{--hl:#8a7a00;--ok:#56d364;--ok-soft:#143021;
  --bg:#12161c;--surface:#1b2129;--fg:#e8ecf1;--muted:#9aa5b4;--line:#2d3540;
  --accent:#ff5c72;--accent-soft:#3a1d23;--app:#6ea8ff;--app-soft:#1a2a44;--web:#f0b54a;--web-soft:#3a2d13;--paper:#c3cad4;--paper-soft:#2a313b;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:28px}
.wrap>section.form+section.form{margin-top:-14px}
h1{font-family:var(--display);font-size:1.9rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0}h3{font-size:1rem;margin:0}
.lead{color:var(--muted);margin:6px 0 0}
.form{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:2px}
.choice b{font-size:1.02rem}.choice span{color:var(--muted);font-size:.88rem}
.choice:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
label{font-weight:500;display:block;margin-bottom:6px}
input[type=date]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.result{display:grid;gap:16px}
.verdict{font-size:1.1rem;font-weight:700}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.phase .row>span:first-child{white-space:nowrap;letter-spacing:.02em}
.phase .row{padding:3px 0;gap:8px}
.phase{padding:14px 12px!important}
.phase .pill,.phase .teach{padding:1px 8px}
@media (max-width:640px){.phases{grid-template-columns:1fr}}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.phase h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.82rem;font-weight:700;white-space:nowrap}
.app{background:var(--app-soft);color:var(--app)}.web{background:var(--web-soft);color:var(--web)}.paper{background:var(--paper-soft);color:var(--paper)}
.warn{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:6px}
.warn ul{margin:4px 0 0;padding-left:20px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface)}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
td:first-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{color:var(--muted);font-size:.88rem}
.datebox{display:grid;gap:10px;justify-items:center;text-align:center}
.bigdate{display:flex;flex-direction:column;align-items:center;gap:8px}
.bigdate small,.bigdate .stage{margin-left:0!important}
.datectl{justify-content:center}
.eyebrow{font-size:.8rem;letter-spacing:.12em;color:var(--muted)}
.bigdate{font-family:var(--display);font-size:clamp(2.6rem,9vw,4rem);line-height:1.1;font-variant-numeric:tabular-nums;color:var(--fg)}
.bigdate small{font-family:var(--body);font-size:.32em;font-weight:500;color:var(--muted);margin-left:.6em;letter-spacing:.05em}
.bigdate .stage{display:inline-block;font-family:var(--body);font-size:.26em;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;margin-left:.6em}
.datectl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.form{padding:24px 24px 20px}
.pills{display:grid;grid-template-columns:auto 4.9em;gap:4px;align-items:center;justify-items:start;flex-shrink:0}
.teach{font:inherit;font-size:.8rem;padding:1px 10px;border-radius:99px;border:1px solid var(--web);background:transparent;color:var(--web);cursor:pointer}
.teach[aria-expanded="true"]{background:var(--web);color:var(--surface)}
.teach:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{margin:0;padding:10px 12px 10px 30px;background:var(--web-soft);border-radius:8px;font-size:.88rem}
.teach.app{border-color:var(--app);color:var(--app);background:transparent}
.teach.app[aria-expanded="true"]{background:var(--app);color:var(--surface)}
.steps.app{background:var(--app-soft)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:.88rem;color:var(--muted)}
.crumb a{color:var(--app);text-decoration:none}.crumb a:hover{text-decoration:underline}
.tsteps{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.tstep{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.tstep h3{margin:0;font-size:.85rem;color:var(--muted);letter-spacing:.06em}.tstep p{margin:0;font-size:1.02rem}
.shot{aspect-ratio:9/16;max-width:min(260px,100%);border-radius:10px;background:var(--paper-soft);color:var(--muted);display:grid;place-items:center;font-size:.8rem;text-align:center;padding:8px}
.tdone{display:flex;gap:8px;align-items:center;font-weight:500}
.back{color:var(--app);text-decoration:none;font-weight:500}
a.teach{text-decoration:none}
.matrix{min-width:560px}
.matrix th,.matrix td{text-align:center;padding:8px 6px}
.matrix td:first-child,.matrix th:first-child{text-align:left;white-space:nowrap}
.matrix .grp td{background:var(--bg);font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-align:left}
.matrix th.cur{color:var(--accent);font-weight:700}
.matrix td.cur,.matrix th.cur{background:var(--accent-soft)}
.chaps{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.chaps a{font-size:.85rem;padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:var(--surface)}
.chap{list-style:none;display:grid;gap:12px;scroll-margin-top:60px}.chap h2{margin:8px 0 0;font-size:1.1rem}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.snum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.tag{font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--paper-soft);color:var(--muted)}
.pos{color:var(--muted);font-size:.88rem}.snote{font-size:.88rem;border-left:3px solid var(--accent);padding-left:10px;color:var(--fg)}
.tstep .shot{max-width:min(200px,100%)}
.faq{display:grid;gap:8px}.faq h2{margin:0;font-size:1.1rem}.faq h3{margin:12px 0 4px;font-size:.85rem;color:var(--muted);letter-spacing:.06em}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.faq summary{cursor:pointer;font-weight:500}.faq details p{margin:8px 0 0}
.thead{display:grid;gap:4px}.thead h1{font-size:1.6rem}
.tbody{display:grid;gap:14px}
.chlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.chbtn{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.chbtn:hover{border-color:var(--accent)}.chbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chno{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.chtx{flex:1;display:grid;min-width:0}.chtx small{color:var(--muted)}
.chst{font-size:.85rem;color:var(--accent);font-weight:500;white-space:nowrap}.chst.ok{color:var(--muted)}
.stepbar{display:flex;gap:4px}.stepbar i{flex:1;height:5px;border-radius:5px;background:var(--line)}.stepbar i.on{background:var(--accent)}
.stepcount{margin:0;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.stepcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
@media (max-width:620px){.stepcard{grid-template-columns:1fr;gap:16px}.stxt{order:-1}.shot.big{margin:0 auto;max-width:180px}}
.shot.big{width:100%;max-width:220px;aspect-ratio:9/16}
.stxt{display:grid;gap:10px;min-width:0;justify-items:start}.stxt h2{margin:0;font-size:1.3rem;line-height:1.4}.stxt p{margin:0}
.stxt .pos{display:grid;gap:2px;color:var(--fg);font-size:.92rem}.stxt .pos b{font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.stxt .snote{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:.9rem}
.stepnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-weight:500}
.sbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.sbtn:disabled{opacity:.4;cursor:default}
.sbtn:focus-visible,.linkbtn:focus-visible,.ftab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkbtn{all:unset;cursor:pointer;color:var(--app);font-weight:500;justify-self:start}
.faqsec{display:grid;gap:12px}
.ftabs{display:flex;flex-wrap:wrap;gap:8px}
.ftab{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.ftab[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.faqlist{display:grid;gap:8px}
.faqlist details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.faqlist summary{cursor:pointer;font-weight:500;display:flex;justify-content:space-between;gap:12px}
.faqlist summary small{color:var(--muted);font-weight:400;white-space:nowrap}
.faqlist details p{margin:10px 0 0;color:var(--fg)}
[hidden]{display:none!important}
.flow{display:grid;justify-items:center;gap:0}
.frow{width:100%;display:grid;gap:8px;justify-items:center}
.frow.multi{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px}
.flabel{margin:0;font-size:.82rem;color:var(--muted)}
.fgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.fnode{all:unset;box-sizing:border-box;cursor:pointer;min-width:132px;flex:0 1 150px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;justify-items:center;gap:4px;text-align:center}
.frow:not(.multi) .fnode{flex-basis:220px}
.fnode:hover{border-color:var(--accent)}.fnode:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fnode b{font-size:1rem}.fnode small{color:var(--muted);font-size:.8rem}
.fno{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.fnode.ok{border-color:var(--ok,#1a7f37)}.fnode.ok .fno{background:var(--muted)}
.farrow{width:2px;height:26px;background:var(--line);position:relative;margin:2px 0 8px}
.farrow::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--line)}
.faside{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.82rem;color:var(--muted)}
.faside span{border-top:2px dashed var(--line);padding-top:4px}
.faside .fnode{flex:0 0 auto;border-style:dashed}
@media (max-width:420px){.fnode{min-width:0;flex:1 1 40%}}
.bigback{justify-self:start;font-size:1rem;font-weight:700;color:var(--fg);text-decoration:none;border:2px solid var(--line);border-radius:10px;padding:10px 16px;background:var(--surface)}
.bigback:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.easy{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;grid-template-columns:44px 1fr;gap:6px 14px}
.enum{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:1.2rem;font-weight:700;display:grid;place-items:center}
.etxt{display:grid;gap:8px;min-width:0}.etxt h2{margin:6px 0 0;font-size:1.25rem;line-height:1.4}.etxt p{margin:0;font-size:1.02rem}
.epos{font-weight:500}
.ecard .shot{grid-column:2;max-width:min(160px,100%);aspect-ratio:9/16;margin-top:6px}
@media (max-width:420px){.ecard{grid-template-columns:1fr}.ecard .shot{grid-column:1}}
.thead h1{font-size:1.7rem}#tmeta{font-size:1rem;color:var(--fg)}
.acc{display:grid;gap:10px}
.accitem{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.accitem>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px;font-size:1.1rem}
.accitem>summary::-webkit-details-marker{display:none}
.accitem>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:700}
.accitem[open]>summary::after{content:"－"}
.accitem>summary small{color:var(--muted);font-size:.85rem}
.accitem>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.accno{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;flex-shrink:0;font-size:.95rem}
.accitem .easy{padding:0 14px 14px}.accitem .ecard{background:var(--bg)}
.keys{background:var(--accent-soft);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.keys h2{margin:0;font-size:1.05rem}.keys ol{margin:0;padding-left:22px;display:grid;gap:6px;font-size:1rem}
.slim{list-style:none;margin:0;padding:0 12px 12px;display:grid;gap:6px}
.srow{background:var(--bg);border-radius:10px}
.srow>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:1rem}
.srow>summary::-webkit-details-marker{display:none}
.srow>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.sno{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;flex-shrink:0}
.stt{flex:1;font-weight:500}
.sdot{font-size:.72rem;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 6px;white-space:nowrap}
.sdetail{padding:0 14px 14px 50px;display:grid;gap:8px}.sdetail p{margin:0}
.sdetail .shot{max-width:min(150px,100%);aspect-ratio:9/16}
@media (max-width:420px){.sdetail{padding-left:14px}}
.tbody>.slim{padding:0}.tbody>.slim .srow{background:var(--surface);border:1px solid var(--line)}
.sbtn.big{width:100%;padding:16px;font-size:1.1rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{font:inherit;font-size:.85rem;white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;flex-shrink:0}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stepcount b{color:var(--fg)}
.tdwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.tdrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tdrow label{font-weight:500;margin:0}
.tdrow input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);flex:1;min-width:0;max-width:240px}
.tdrow input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tchk{display:flex;gap:8px;align-items:center;font-weight:700;font-size:1.05rem;cursor:pointer}
.tchk input{width:20px;height:20px;accent-color:var(--accent)}
.tstamp{margin:0;color:var(--ok,#1a7f37);font-weight:500;font-variant-numeric:tabular-nums}
.tstamp:empty{display:none}
.teach.done,.teach.done.app{background:var(--ok-soft,#e6f4ea);border-color:var(--ok,#1a7f37);color:var(--ok,#1a7f37)}
.teach.done::before{content:"✓ "}
#phases{display:grid;gap:14px;grid-template-columns:1fr!important}
.phnav{display:flex;gap:6px;background:#2f3437;border-radius:999px;padding:6px;justify-self:center;width:100%;max-width:520px}
.phtab{all:unset;cursor:pointer;flex:1;display:grid;justify-items:center;gap:2px;padding:8px 6px;border-radius:999px;background:#fff;color:#4b5563;font-size:.85rem;font-weight:500;transition:background .15s,color .15s}
.phtab:hover,.phtab:focus-visible{background:var(--accent);color:#fff}
.phtab[aria-selected="true"]{background:linear-gradient(135deg,#f0682a,var(--accent));color:#fff}
.phtab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.phpanel .phase{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px!important;display:grid;gap:12px}
.phsub{margin:0;color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tiles .row{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:16px 8px!important;background:var(--surface);transition:border-color .15s,color .15s}
.tiles .row>span:first-child{font-size:1rem;font-weight:500;white-space:normal}
.tiles .row:hover{border-color:var(--accent);color:var(--accent)}
.tiles .pills{grid-template-columns:auto auto!important;justify-content:center}
@media (prefers-reduced-motion:reduce){.phtab,.tiles .row{transition:none}}
#phases{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))!important;gap:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0!important;display:block!important;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pc:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(200,16,46,.08)}

/* 放到 GitHub Pages 時，把 GAS「網頁應用程式」部署網址（/exec 結尾）貼在這裡 */
const API_URL='https://script.google.com/macros/s/AKfycbzcSp3ue76N-lqqqrdIiayPRmGsYjvAAuhszp4loa87H1OrMEuqN6SjEo5Ojf7EhdWX/exec';
/*RUN_START*/
const run=(fn,...a)=>(window.google&&google.script&&google.script.run)
  ?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e))[fn](...a))
  :fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
    .then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.error);return r.result;});
/*RUN_END*/
const $=id=>document.getElementById(id);
let READS={},D=null,role='POC',OPENF=null,CUR='',PEND=null;
/* 閱讀狀態與 FAQ 回饋存在這台裝置的瀏覽器裡，同時回寫後台「閱讀紀錄」 */
function saveReads(){try{localStorage.setItem('reads',JSON.stringify(READS))}catch(_){}}
function nowStr(){const n=new Date(),z=x=>String(x).padStart(2,'0');return `${n.getFullYear()}/${z(n.getMonth()+1)}/${z(n.getDate())} ${z(n.getHours())}:${z(n.getMinutes())}`;}
function myName(){try{return localStorage.getItem('myname')||''}catch(_){return ''}}
const PH_ICON={'出團前':'<path d="M9 4h6v3H9z"/><path d="M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><path d="M9 11h6M9 15h6"/>','帶團中':'<path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/>','回團後':'<rect x="5" y="4" width="14" height="16" rx="1.5"/><path d="m9 12 2 2 4-4"/>'};
const P={APP:'<span class="pill app">APP</span>',WEB:'<span class="pill web">WEB</span>','紙本':'<span class="pill paper">紙本</span>','未提供':'<span class="note">未提供</span>','':'<span class="note">—</span>'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400);}
function err(e){toast((e&&e.message)||String(e));}

/* ---------- 主題 ---------- */
(function(){const r=document.documentElement;let m=null;try{m=localStorage.getItem('theme')}catch(_){}
  const ap=v=>{r.setAttribute('data-theme',v);$('themetxt').textContent=v==='dark'?'淺色模式':'深色模式';};ap(m||'light');
  $('themebtn').onclick=()=>{const v=r.getAttribute('data-theme')==='dark'?'light':'dark';ap(v);try{localStorage.setItem('theme',v)}catch(_){}};})();

/* ---------- 啟動 ---------- */
(async()=>{try{READS=JSON.parse(localStorage.getItem('reads')||'{}')||{}}catch(_){READS={}}
  const fail=()=>{$('phases').innerHTML='<p class="note" style="padding:2.5rem 1rem;text-align:center;font-size:1rem">連線失敗，請重新整理網頁。若還是不行，請稍後再試。</p>';};
  const boot=d=>{D=d;document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===role));
    if(!$('dep').value){const n=new Date();$('dep').value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;}
    render();drawFaq();};
  let cached=null;try{cached=localStorage.getItem('dcache')}catch(_){}
  if(cached){try{boot(JSON.parse(cached));}catch(_){cached=null;}}
  let fresh;
  try{fresh=await run('getData');}catch(x){if(!cached)fail();return;}
  if(!fresh||!fresh.ok){if(!cached)fail();return;}
  const js=JSON.stringify(fresh);
  try{localStorage.setItem('dcache',js)}catch(_){}
  if(js!==cached)boot(fresh);})();

function period(v){return D.periods.find(p=>(!p.start||v>=p.start)&&(!p.end||v<=p.end))||D.periods[D.periods.length-1];}
function plat(code,pc){return ((D.plat[role+'|'+code]||{})[pc])||'';}

const KIND_ICON={'影片':'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>','簡報':'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M12 16v3M8 20h8"/>','文件':'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>','其他':'<path d="M10 14 20 4M14 4h6v6"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'};
function kindIco(k){return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${KIND_ICON[k]||KIND_ICON['其他']}</svg>`;}
function linksOf(f,p){return (p==='APP'||p==='WEB')?(D.links||[]).filter(l=>l.feat===f.code&&(!l.plat||l.plat===p)):[];}
function lineOpts(sel){return '<option value="">線別</option>'+(D.lines||[]).map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');}
function myLine(){try{return localStorage.getItem('myline')||''}catch(_){return ''}}
function titem(l){const rd=READS['read:'+l.id],who=READS['name:'+l.id],ln=READS['line:'+l.id];
  return `<div class="titem"><a class="tlink" href="${esc(l.url)}" data-url="${esc(l.url)}" data-title="${esc(l.title)}"><span class="ti">${kindIco(l.kind)}</span><span class="tt">${esc(l.title)}</span><span class="go">${esc(l.kind||'連結')} 開啟 ↗</span></a>`+
   (rd?`<div class="rdok">✓ ${esc(ln)}　${esc(who)}　${esc(rd)} 已閱讀<button data-undo="${esc(l.id)}" data-title="${esc(l.title)}">取消</button></div>`
      :`<div class="rdhint">看完後回到這裡，選線別、輸入姓名並按「已閱讀」</div><div class="rd" data-id="${esc(l.id)}" data-title="${esc(l.title)}"><select aria-label="線別">${lineOpts(myLine())}</select><input placeholder="姓名" value="${esc(myName())}" aria-label="姓名" autocomplete="name"><button class="rdbtn">已閱讀</button></div>`)+`</div>`;}
function tile(f,pc){const p=plat(f.code,pc),links=linksOf(f,p);
  const img=FIMG[f.name]?`<img src="${FIMG[f.name]}" width="34" height="34" alt="">`:'';
  const all=links.length&&links.every(l=>READS['read:'+l.id]);
  const btn=links.length?`<button class="teach ${p.toLowerCase()}${all?' done':''}" data-tg="${esc(f.code)}" aria-haspopup="dialog">教學${links.length>1?'（'+links.length+'）':''}</button>`:'';
  return `<div class="row tile"><div class="fhead"><span class="tico">${img}</span><span class="tname">${esc(f.name)}</span><span class="pills">${P[p]||esc(p)}${btn}</span></div></div>`;}
function render(){const v=$('dep').value;if(!v||!D)return;const per=period(v),dt=new Date(v+'T00:00');CUR=per.code;
  $('bigdate').innerHTML=`${dt.getMonth()+1}月${dt.getDate()}日<small>${dt.getFullYear()}・週${'日一二三四五六'[dt.getDay()]}</small><span class="stage">${esc(per?per.name:'')}</span>`;
  $('phases').innerHTML=['出團前','帶團中','回團後'].map(ph=>{const fs=D.feats.filter(f=>f.phase===ph).sort((a,b)=>a.order-b.order);
    return `<div class="phase pc"><div class="pchead"><span class="pill2">${ico(ph)}<span>${ph}</span></span></div><div class="pclist">${fs.map(f=>tile(f,per.code)).join('')||'<p class="note">尚無功能</p>'}</div></div>`;}).join('');
  $('mtitle').textContent='整體時程・'+(role==='一般'?'一般領隊':'POC 團領隊');
  let h='<thead><tr><th>功能</th>'+D.periods.map(p=>`<th class="${p.code===per.code?'cur':''}">${esc(p.name)}</th>`).join('')+'</tr></thead><tbody>';
  ['出團前','帶團中','回團後'].forEach(ph=>{const fs=D.feats.filter(f=>f.phase===ph).sort((a,b)=>a.order-b.order);if(!fs.length)return;h+=`<tr class="grp"><td colspan="${D.periods.length+1}">${ph}</td></tr>`;
    fs.forEach(f=>{h+=`<tr><td>${esc(f.name)}</td>`+D.periods.map(p=>`<td class="${p.code===per.code?'cur':''}">${P[plat(f.code,p.code)]||esc(plat(f.code,p.code))}</td>`).join('')+'</tr>';});});
  $('matrix').innerHTML=h+'</tbody>';drawModal();}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('dep').addEventListener('input',render);

/* ---------- 教學視窗 ---------- */
function drawModal(){const m=$('tmask');if(!OPENF){m.hidden=true;return;}
  const f=D.feats.find(x=>x.code===OPENF);if(!f){OPENF=null;m.hidden=true;return;}
  const p=plat(f.code,CUR),links=linksOf(f,p);
  const img=FIMG[f.name]?`<img src="${FIMG[f.name]}" width="30" height="30" alt="">`:'';
  $('tmhead').innerHTML=`<span class="tico">${img}</span><span class="tmname" id="tmtitle">${esc(f.name)}</span>${P[p]||esc(p)}<button class="tmclose" aria-label="關閉">×</button>`;
  $('tmbody').innerHTML=`<div class="tlabel">教學</div>`+links.map(titem).join('');
  const was=m.hidden;m.hidden=false;if(was)$('tmhead').querySelector('.tmclose').focus();}
function closeModal(){OPENF=null;drawModal();}
$('tmask').addEventListener('click',e=>{if(e.target.id==='tmask'||e.target.closest('.tmclose'))closeModal();});
/* 開教學前的提醒 */
function closeNotice(){PEND=null;$('nmask').hidden=true;}
$('ncancel').onclick=closeNotice;$('nmask').addEventListener('click',e=>{if(e.target.id==='nmask')closeNotice();});
$('ngo').onclick=()=>{const u=PEND&&PEND.url;closeNotice();if(!u||u==='#'){toast('這是範例連結，之後會開啟真正的教學');return;}
  const w=window.open(u,'_blank','width=1100,height=800');if(w){try{w.opener=null}catch(_){}}else toast('瀏覽器擋住了新視窗，請允許本頁開啟彈出視窗後再試一次');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('nmask').hidden)closeNotice();else if(!$('qmask').hidden)closeQuery();else if(OPENF)closeModal();}});
document.addEventListener('click',e=>{
  const lk=e.target.closest('.tlink');if(lk){e.preventDefault();PEND={url:lk.dataset.url};$('nname').textContent=lk.dataset.title;$('nmask').hidden=false;$('ngo').focus();return;}
  const tg=e.target.closest('[data-tg]');if(tg){OPENF=tg.dataset.tg;drawModal();return;}
  const b=e.target.closest('.rdbtn');if(b){const w=b.closest('.rd'),inp=w.querySelector('input'),sel=w.querySelector('select'),n=inp.value.trim(),ln=sel.value;
    if(!ln){sel.focus();sel.style.borderColor='var(--accent)';toast('請先選擇線別');return;}
    if(!n){inp.focus();inp.style.borderColor='var(--accent)';toast('請先輸入你的姓名');return;}
    const id=w.dataset.id;READS['read:'+id]=nowStr();READS['name:'+id]=n;READS['line:'+id]=ln;saveReads();try{localStorage.setItem('myname',n);localStorage.setItem('myline',ln)}catch(_){}
    run('markRead',ln,n,id,w.dataset.title).catch(err);render();return;}
  const u=e.target.closest('[data-undo]');if(u){const id=u.dataset.undo,ln=READS['line:'+id],n=READS['name:'+id];delete READS['read:'+id];delete READS['name:'+id];delete READS['line:'+id];saveReads();run('markRead',ln,n,id,u.dataset.title,true).catch(()=>{});render();return;}
  if(e.target.closest('#qopen')){openQuery();return;}
  const t=e.target.closest('.ftab');if(t){faqTp=t.dataset.tp;drawFaq();return;}
  const fb=e.target.closest('.fbb');if(fb){const q=fb.closest('.fb').dataset.q;READS['fb:'+q]=fb.dataset.v;saveReads();drawFaq();run('logEvent','FAQ回饋',q,fb.dataset.v).catch(()=>{});}});

/* ---------- 查詢閱讀紀錄 ---------- */
function openQuery(){$('qline').innerHTML=lineOpts(myLine());$('qname').value=myName();$('qres').innerHTML='';$('qmask').hidden=false;$('qname').focus();}
function closeQuery(){$('qmask').hidden=true;}
$('qmask').addEventListener('click',e=>{if(e.target.id==='qmask'||e.target.closest('.tmclose'))closeQuery();});
$('qform').addEventListener('submit',async e=>{e.preventDefault();const ln=$('qline').value,n=$('qname').value.trim();
  if(!ln){toast('請先選擇線別');return;}if(!n){toast('請先輸入姓名');return;}
  $('qbtn').disabled=true;$('qbtn').textContent='查詢中…';
  try{const r=await run('lookupReads',ln,n);const reads=r.reads||{},links=D.links||[],got=links.filter(l=>reads[l.id]).length;
    if(!Object.keys(reads).length){$('qres').innerHTML=`<p class="note qnone">找不到「${esc(ln)}　${esc(n)}」的閱讀紀錄。請確認線別和姓名，要和按「已閱讀」時輸入的一樣。</p>`;return;}
    const groups=[];links.forEach(l=>{const f=D.feats.find(x=>x.code===l.feat);if(!f)return;let g=groups.find(x=>x.f===f);if(!g)groups.push(g={f,items:[]});g.items.push(l);});
    $('qres').innerHTML=`<p class="qsum"><b>${esc(ln)}　${esc(n)}</b>　已閱讀 ${got} / ${links.length} 個教學</p>`+groups.map(g=>`<div class="qgrp"><div class="qfeat">${esc(g.f.name)}</div>${g.items.map(l=>`<div class="qrow ${reads[l.id]?'ok':'no'}"><span>${esc(l.title)}</span><span>${reads[l.id]?'✓ '+esc(reads[l.id]):'未閱讀'}</span></div>`).join('')}</div>`).join('');
  }catch(x){err(x);}finally{$('qbtn').disabled=false;$('qbtn').textContent='查詢';}});

/* ---------- FAQ ---------- */
let faqTp='全部';
function drawFaq(){const all=D.faq,tps=['全部',...new Set(all.map(f=>f.tp))];if(tps.indexOf(faqTp)<0)faqTp='全部';
  $('faqtabs').innerHTML=tps.map(t=>`<button class="ftab" aria-pressed="${t===faqTp}" data-tp="${esc(t)}">${esc(t)}</button>`).join('');
  $('faqlist').innerHTML=all.filter(f=>faqTp==='全部'||f.tp===faqTp).map(f=>{const fb=READS['fb:'+f.q];const fn=(D.feats.find(x=>x.code===f.feat)||{}).name||'';
    return `<details><summary><span>${esc(f.q)}</span><small>${esc(fn)}</small></summary><p>${esc(f.a)}</p>
    <div class="fb" data-q="${esc(f.q)}"><span>這則回答有幫助嗎？</span><button class="fbb" data-v="有幫助" aria-pressed="${fb==='有幫助'}">有幫助</button><button class="fbb" data-v="沒幫助" aria-pressed="${fb==='沒幫助'}">沒幫助</button><span class="fbmsg">${fb?'謝謝你的回饋':''}</span></div></details>`;}).join('');
  $('faqadd').innerHTML='';}
</script>

</body></html>
